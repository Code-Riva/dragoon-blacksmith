<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Restrained ambient coin glow -->
    <filter id="restrained-coin-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#f97316" flood-opacity="0.32" />
    </filter>

    <!-- Metallic rim gradient -->
    <linearGradient id="coin-rim-grad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <!-- Coin inner face radial gradient -->
    <radialGradient id="coin-face-grad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3d1607" />
      <stop offset="60%" stop-color="#240c03" />
      <stop offset="100%" stop-color="#140601" />
    </radialGradient>

    <!-- Dragon shade background fill gradient -->
    <linearGradient id="dragon-shade-grad" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0.12" />
    </linearGradient>

    <!-- Engraved 'D' bevel & face gradient -->
    <linearGradient id="engraved-d-face" x1="22" y1="18" x2="42" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="30%" stop-color="#fb923c" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Engraving chisel shadow -->
    <linearGradient id="engraved-d-shadow" x1="20" y1="18" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a0601" />
      <stop offset="100%" stop-color="#080200" />
    </linearGradient>
  </defs>

  <!-- Base coin disk with outer crisp rim and restrained glow -->
  <circle cx="32" cy="32" r="29" fill="url(#coin-rim-grad)" filter="url(#restrained-coin-glow)" stroke="#f97316" stroke-width="1.2" />

  <!-- Inner coin milled edge / bevel ring -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#fed7aa" stroke-width="0.8" stroke-opacity="0.65" />
  <circle cx="32" cy="32" r="25" fill="url(#coin-face-grad)" stroke="#7c2d12" stroke-width="0.75" />

  <!-- Beaded inner rim detail -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#f97316" stroke-width="0.75" stroke-dasharray="1.2 2" stroke-opacity="0.45" />

  <!-- Dragon shade background silhouette (mythical dragon wings, horn, and serpentine body) -->
  <g fill="url(#dragon-shade-grad)" transform="translate(0, 0)">
    <!-- Dragon wings sweeping in upper background -->
    <path d="M26 15C29 12 36 11 43 14C40 16 38 18 39 21C42 19 46 19 49 22C46 23 43 25 44 28C40 27 36 29 34 32C33 28 32 24 29 21C27 19 25 17 26 15Z" />
    <!-- Dragon head silhouette with horn facing top-right -->
    <path d="M38 18C41 17 45 15 48 16C46 18 45 20 47 21C44 21 42 22 41 24C39 22 38 20 38 18Z" />
    <!-- Dragon wing webbing & coiling tail in lower background -->
    <path d="M44 28C47 31 48 36 46 41C44 45 40 48 35 49C40 47 43 43 43 38C43 34 40 31 38 29L44 28Z" />
    <path d="M20 28C17 32 16 38 19 43C21 46 25 48 29 49C24 48 21 44 21 40C21 35 23 32 25 30L20 28Z" />
    <path d="M31 47C33 49 37 50 40 49C36 51 32 50 30 48L31 47Z" />
  </g>

  <!-- Engraved "D" - Deep incised drop shadow layer (gives chiseled sunken effect) -->
  <path
    d="M23 18.5H32.5C38.5 18.5 43.5 22.8 43.5 31.5C43.5 40.2 38.5 44.5 32.5 44.5H23V18.5ZM28 23.5V39.5H32C35.8 39.5 38.5 36.5 38.5 31.5C38.5 26.5 35.8 23.5 32 23.5H28Z"
    fill="url(#engraved-d-shadow)"
    transform="translate(0.8, 1)"
  />

  <!-- Engraved "D" - Top highlight bevel layer -->
  <path
    d="M23 18.5H32.5C38.5 18.5 43.5 22.8 43.5 31.5C43.5 40.2 38.5 44.5 32.5 44.5H23V18.5ZM28 23.5V39.5H32C35.8 39.5 38.5 36.5 38.5 31.5C38.5 26.5 35.8 23.5 32 23.5H28Z"
    stroke="#ffedd5"
    stroke-width="0.6"
    stroke-opacity="0.4"
    fill="none"
    transform="translate(-0.3, -0.4)"
  />

  <!-- Engraved "D" - Primary engraved minted metal face -->
  <path
    d="M23 18.5H32.5C38.5 18.5 43.5 22.8 43.5 31.5C43.5 40.2 38.5 44.5 32.5 44.5H23V18.5ZM28 23.5V39.5H32C35.8 39.5 38.5 36.5 38.5 31.5C38.5 26.5 35.8 23.5 32 23.5H28Z"
    fill="url(#engraved-d-face)"
  />

  <!-- Serif coin accents on the stem of D -->
  <rect x="21" y="18" width="5.5" height="1.8" rx="0.4" fill="url(#engraved-d-face)" />
  <rect x="21" y="43.2" width="5.5" height="1.8" rx="0.4" fill="url(#engraved-d-face)" />
</svg>
